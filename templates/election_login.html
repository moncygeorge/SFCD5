<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFCD Voting</title></head><body style="font-family:Arial;background:#f4f6f8"><main style="max-width:430px;margin:50px auto;background:white;padding:28px;border-radius:14px"><h1>SFCD Voting</h1>{% for cat,msg in get_flashed_messages(with_categories=true) %}<p>{{ msg }}</p>{% endfor %}<p>Enter your registered phone number to receive a verification code.</p><form method="post"><input name="phone" inputmode="tel" required style="width:100%;padding:12px;box-sizing:border-box"><button style="width:100%;padding:13px;margin-top:12px">Send Verification Code</button></form></main></body></html>
