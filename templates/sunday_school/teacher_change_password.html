<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Change Password</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#243447}header{background:#17324d;color:white;padding:18px}
.head{max-width:600px;margin:auto;display:flex;justify-content:space-between;align-items:center}header a{color:white}.container{max-width:520px;margin:35px auto;padding:0 15px}
.card{background:white;padding:26px;border-radius:12px;box-shadow:0 2px 10px #0001}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 17px;border:1px solid #ccd3da;border-radius:7px;font-size:16px}
button{width:100%;background:#17324d;color:white;border:0;border-radius:7px;padding:12px;font-size:16px;font-weight:bold}.flash{background:#fff4cc;padding:11px;border-radius:7px;margin-bottom:13px}
</style></head><body>
<header><div class="head"><strong>Teacher Portal</strong><a href="{{url_for('sunday_school.teacher_dashboard')}}">Dashboard</a></div></header>
<div class="container"><div class="card"><h1>Change Password</h1>
{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}
<form method="post"><label>Current Password</label><input type="password" name="current_password" required>
<label>New Password</label><input type="password" name="new_password" minlength="8" required>
<label>Confirm New Password</label><input type="password" name="confirm_password" minlength="8" required>
<button>Update Password</button></form></div></div></body></html>
