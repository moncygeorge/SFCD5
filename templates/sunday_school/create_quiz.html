<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Quiz</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#243447}header{background:#17324d;color:white;padding:18px}.head{max-width:950px;margin:auto;display:flex;justify-content:space-between;align-items:center}header a{color:white}.container{max-width:950px;margin:25px auto;padding:0 15px}.card{background:white;padding:22px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:18px}.btn,button{display:inline-block;background:#17324d;color:white;border:0;text-decoration:none;padding:10px 14px;border-radius:7px;cursor:pointer}.danger{background:#9b2c2c}.muted{color:#667}.flash{background:#fff4cc;padding:11px;border-radius:7px;margin-bottom:14px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 14px;border:1px solid #ccd3da;border-radius:7px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #ddd;vertical-align:top}.inline{display:inline}.published{color:green;font-weight:bold}.draft{color:#9a6700;font-weight:bold}.options{margin:8px 0 14px}.q{border-left:4px solid #17324d;padding-left:15px}</style></head><body>
<header><div class="head"><strong>SFCD Sunday School — Teacher Portal</strong><a href="{{url_for('sunday_school.teacher_dashboard')}}">Dashboard</a></div></header>
<div class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}
<div class="card"><h1>Create Quiz</h1><p>Class: <strong>{{class_row.name}}</strong></p><form method="post">
<label>Quiz Title</label><input name="title" placeholder="Unit 1 Review" required>
<label>Instructions</label><textarea name="instructions" rows="4" placeholder="Choose the best answer."></textarea>
<button>Create Draft Quiz</button></form></div>
</div></body></html>
