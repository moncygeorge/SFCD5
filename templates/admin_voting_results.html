<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voting Results</title><style>body{font-family:Arial;background:#f4f6f8;color:#243447}.wrap{max-width:760px;margin:30px auto}.card{background:white;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0001}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.btn{display:inline-block;background:#17324d;color:white;padding:10px 14px;border-radius:7px;text-decoration:none}</style></head><body><div class="wrap"><div class="card"><a class="btn" href="/admin_dashboard">Back to Dashboard</a><h1>{{ event.title }}</h1><p>{{ event.question }}</p><p>Status: <strong>{{ event.status|title }}</strong> &nbsp; Total votes: <strong>{{ total }}</strong></p><table><tr><th>Choice</th><th>Votes</th></tr>{% for r in tally %}<tr><td>{{ r.choice }}</td><td>{{ r.cnt }}</td></tr>{% endfor %}</table></div></div></body></html>
