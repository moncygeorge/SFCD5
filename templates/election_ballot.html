<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ phase.position }}</title></head><body style="font-family:Arial;background:#f4f6f8"><main style="max-width:540px;margin:40px auto;background:white;padding:28px;border-radius:14px"><p>{{ election.title }}</p><h1>{{ phase.position }}</h1>{% for cat,msg in get_flashed_messages(with_categories=true) %}<p>{{ msg }}</p>{% endfor %}<form method="post" action="{{ url_for('election_vote') }}">{% for c in candidates %}<label style="display:block;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:8px"><input type="radio" name="candidate_id" value="{{ c.id }}" required> {{ c.name }}</label>{% endfor %}<button style="width:100%;padding:14px">Submit Vote</button></form></main><script>let p={{ phase.id }};setInterval(async()=>{try{let d=await(await fetch('/election/status',{cache:'no-store'})).json();if(!d.session_open||d.phase_id!==p)location.reload()}catch(e){}},3000)</script></body></html>
