<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFCD Voting</title></head><body style="font-family:Arial;background:#f4f6f8"><main style="max-width:540px;margin:50px auto;background:white;padding:30px;border-radius:14px;text-align:center"><h1>{{ election.title if election else 'SFCD Voting' }}</h1><p>{{ message }}</p><p>Please keep this page open.</p></main><script>let x=null;setInterval(async()=>{try{let d=await(await fetch('/election/status',{cache:'no-store'})).json(),k=[d.session_open,d.session_id,d.phase_id].join(':');if(x===null)x=k;else if(k!==x)location.reload()}catch(e){}},3000)</script></body></html>
